name: Build + Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore google-services.json from secret
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Check google-services.json exists
        run: ls -l android/app/google-services.json

      - name: Restore upload keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Restore key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n' "$STORE_PASSWORD" "$KEY_PASSWORD" > android/key.properties

      - run: flutter pub get

      - name: Patch super_keyboard compileSdk 34 -> 36
        run: sed -i 's/compileSdk = 34/compileSdk = 36/' /home/runner/.pub-cache/hosted/pub.dev/super_keyboard-*/android/build.gradle

      - run: flutter build apk --release

      # Rename so users always download the same filename
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/flutter_ex-releases.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/flutter_ex-releases.apk