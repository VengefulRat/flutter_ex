name: Build + Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Restore google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Check google-services.json exists
        run: ls -lh android/app/google-services.json && wc -c android/app/google-services.json

      - run: flutter build apk --release

      # Rename so users always download the same filename
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/flutter_ex-releases.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/flutter_ex-releases.apk