name: Build + Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore google-services.json from secret
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Check google-services.json exists
        run: ls -l android/app/google-services.json

      - name: Restore upload keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Restore key.properties
        run: |
          cat > android/key.properties <<'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - run: flutter pub get
      - run: flutter build apk --release

      # Rename so users always download the same filename
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/flutter_ex-releases.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/flutter_ex-releases.apk